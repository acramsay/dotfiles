[Interface]
# Proton WireGuard tunnel; swap servers with `task ot:vpn-import` (see docs/vpn.md).
Address = 10.2.0.2/32, 2a07:b944::2:2/128
PreUp = ip route replace $(ip route show table main default | head -1) table 200
PostUp = wg set %i private-key /etc/wireguard/proton.key
PostUp = while ip rule show | grep -q 'to 100.64.0.0/10 lookup 52'; do ip rule del to 100.64.0.0/10 lookup 52; done; ip rule add to 100.64.0.0/10 lookup 52 priority 5200
PostUp = while ip -6 rule show | grep -q 'to fd7a:115c:a1e0::/48 lookup 52'; do ip -6 rule del to fd7a:115c:a1e0::/48 lookup 52; done; ip -6 rule add to fd7a:115c:a1e0::/48 lookup 52 priority 5200
PostUp = while ip rule show | grep -q 'fwmark 0x100/0x100 lookup 200'; do ip rule del fwmark 0x100/0x100 table 200; done; ip rule add fwmark 0x100/0x100 table 200 priority 5207
PostUp = nft list table ip vpn_bypass >/dev/null 2>&1 && nft delete table ip vpn_bypass; nft -f /etc/wireguard/vpn-bypass.nft
PreDown = nft delete table ip vpn_bypass || true
PreDown = ip rule del to 100.64.0.0/10 lookup 52 || true
PreDown = ip -6 rule del to fd7a:115c:a1e0::/48 lookup 52 || true
PreDown = ip rule del fwmark 0x100/0x100 table 200 || true
PreDown = ip route flush table 200 || true

[Peer]
PublicKey = ePaJ2vLb/+bIbE+V7DD2DHyLqX9FsbKwHP4XTyPv4GU=
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = 62.93.176.129:51820
PersistentKeepalive = 25
