[Interface]
# Proton WireGuard tunnel. Swap servers with `task ot:vpn-import` (see docs/vpn.md).
Address = 10.2.0.2/32
# Address = 10.2.0.2/32, 2a07:b944::2:2/128
PreUp = ip route replace $(ip route show table main default | head -1) table 200
# PreUp = ip -6 route replace $(ip -6 route show table main default | head -1) table 201 || true
PostUp = wg set %i private-key /etc/wireguard/proton.key
# Clear rules left by ungraceful exits, then add exactly one.
PostUp = while ip rule show | grep -q 'fwmark 0x200 lookup 200'; do ip rule del fwmark 0x200 table 200; done; ip rule add fwmark 0x200 table 200
# PostUp = ip -6 rule add fwmark 0x201 table 201 || true
# Delete a table left by a crashed down so nft -f can load it.
PostUp = nft list table ip vpn_bypass >/dev/null 2>&1 && nft delete table ip vpn_bypass; nft -f /etc/wireguard/vpn-bypass.nft
PostUp = /usr/bin/bash /etc/tailscale/vpn-dns-refresh.sh up
PreDown = /usr/bin/bash /etc/tailscale/vpn-dns-refresh.sh down
PreDown = nft delete table ip vpn_bypass || true
PreDown = ip rule del fwmark 0x200 table 200 || true
PreDown = ip route flush table 200 || true
# PreDown = ip -6 rule del fwmark 0x201 table 201 2>/dev/null || true

[Peer]
PublicKey = ePaJ2vLb/+bIbE+V7DD2DHyLqX9FsbKwHP4XTyPv4GU=
AllowedIPs = 0.0.0.0/0
# AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = 62.93.176.129:51820
PersistentKeepalive = 25
