# dnsmasq is the single stub resolver (127.0.0.1) in both tunnel states.
# Upstreams come only from the servers-file so dnsmasq never loops back to itself
# (no-resolv disables resolv-file but not servers-file).
no-resolv

# Strict order: otherwise a tunnel-up lookup can fall through to the LAN gateway.
strict-order

# Regenerated by vpn-dns-refresh.sh; re-read on SIGHUP.
servers-file=/etc/dnsmasq.d/dnsmasq.servers

# Tailscale MagicDNS names, regenerated by vpn-dns-refresh.sh (inotify-watched).
hostsdir=/etc/dnsmasq.d/hosts.d

# Bypass whitelist: resolved A records are injected into the nft set. /4 = A.
# nftset=/nh.gov/6#inet#vpn_bypass#bypass6
nftset=/doxy.me/4#ip#vpn_bypass#bypass
nftset=/hlg.tokbox.com/4#ip#vpn_bypass#bypass
nftset=/nh.gov/4#ip#vpn_bypass#bypass
nftset=/portal.therapyappointment.com/4#ip#vpn_bypass#bypass
