# dnsmasq is the single stub resolver in both tunnel states (see docs/vpn.md).
no-resolv
interface=tailscale0
interface=enp18s0
strict-order
servers-file=/etc/dnsmasq.d/dnsmasq.servers
hostsdir=/etc/dnsmasq.d/hosts.d

# Bypass whitelist: inject resolved A records into the nft set (/4 = A).
nftset=/doxy.me/4#ip#vpn_bypass#bypass
nftset=/hlg.tokbox.com/4#ip#vpn_bypass#bypass
nftset=/nh.gov/4#ip#vpn_bypass#bypass
nftset=/portal.therapyappointment.com/4#ip#vpn_bypass#bypass
