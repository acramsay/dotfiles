version: '3'

tasks:
  init:
    cmds:
      - task: packages
      - task: deploy-etc
      - sudo systemctl restart systemd-sysctl
      - if: '[ "$(firewall-cmd --get-zone-of-interface=tailscale0)" != trusted ]'
        cmd: sudo firewall-cmd --zone=trusted --add-interface=tailscale0
      - if: '[ "$(firewall-cmd --permanent --zone=trusted --query-interface=tailscale0)" != yes ]'
        cmd: sudo firewall-cmd --permanent --zone=trusted --add-interface=tailscale0
      # nftset= needs netlink_netfilter_socket; compile the repo module, never audit2allow.
      - if: "! sudo semodule -l | grep -q '^dnsmasq-nftset'"
        cmd: |
          cd {{ .REALPATH }}/linux/selinux
          checkmodule -M -m -o dnsmasq-nftset.mod dnsmasq-nftset.te
          semodule_package -o dnsmasq-nftset.pp -m dnsmasq-nftset.mod
          sudo semodule -i dnsmasq-nftset.pp
      # Leftover from the abandoned fragment design.
      - sudo rm -f /etc/dnsmasq.d/vpn-upstream.conf
      # Generate dnsmasq's servers-file before it starts.
      - sudo systemctl daemon-reload
      - sudo systemctl start vpn-dns.service
      - sudo systemctl enable --now dnsmasq.service
      # enable --now won't restart; the deployed conf lists interfaces.
      - sudo systemctl restart dnsmasq.service
      - sudo systemctl enable --now vpn-dns.timer
      # Enable only: a fresh machine has no key, so starting now would fail.
      - sudo systemctl enable wg-quick@proton.service
      - sudo loginctl enable-linger $USER
      - flatpak override --user --talk-name=org.freedesktop.Flatpak md.obsidian.Obsidian
      - |
        sudo touch /etc/sudoers.d/$USER
        sudo dd of=/etc/sudoers.d/$USER <<- EOF
        $USER ALL=(ALL) NOPASSWD: /usr/bin/zypper dup -ly --allow-vendor-change --replacefiles
        EOF

  packages:
    desc: Install declared system packages via zypper (already-installed are skipped by zypper)
    vars:
      PACKAGES:
        - wireguard-tools
        - openresolv
        - dnsmasq
        - docker
        - tailscale
        - librewolf
        - steam
        - OpenRGB
        - OpenRGB-udev-rules
        - gcc-c++
        - libgit2-devel
        - libwebkit2gtk-4_1-0
        - nvidia-driver-G06-kmp-default
        - nvidia-userspace-meta-G06
        - openSUSE-repos-Tumbleweed-NVIDIA
        - ucode-amd
        - policycoreutils-python-utils
        - checkpolicy
    cmds:
      - sudo zypper --non-interactive install {{ .PACKAGES | join " " }}

  deploy-etc:
    desc: Deploy everything under linux/etc/** into /etc
    aliases: [de]
    vars:
      REALPATH_ETC: '{{ joinPath .REALPATH "linux" "etc" }}'
      COPY_FILES:
        map:
          # Confined daemons (dnsmasq_t, NetworkManager_t, systemd init_t, and
          # wireguard_t for wg-quick@proton) can't read symlinks into $HOME, so
          # these are copies. See docs/vpn.md.
          dnsmasq.d/vpn-bypass.conf: 'true'
          sysctl.d/99-vpn-forwarding.conf: 'true'
          wireguard/proton.conf: 'true'
          wireguard/vpn-bypass.nft: 'true'
          resolv.conf: 'true'
          NetworkManager/conf.d/90-dns.conf: 'true'
          systemd/system/vpn-dns.service: 'true'
          systemd/system/vpn-dns.timer: 'true'
      FILES:
        sh: find {{ .REALPATH_ETC }} -type f -printf "%P\n"
    cmds:
      - for:
          var: FILES
        vars:
          SOURCE: '{{ joinPath .REALPATH_ETC .ITEM }}'
          DESTINATION: '{{ joinPath "/etc" .ITEM }}'
          SUDO: 'true'
          COPY: '{{ index .COPY_FILES .ITEM | default "" }}'
        task: :deploy-file

  vpn-import:
    desc: Switch the active Proton tunnel to a downloaded WireGuard config
    aliases: [vi]
    summary: |
      Usage: task ot:vpn-import -- <path-to-downloaded.conf>
      Copies Address/PublicKey/Endpoint into the repo's proton.conf (hooks and
      comments preserved), writes the PrivateKey to /etc/wireguard/proton.key,
      and restarts the tunnel if it is up. Previous files are kept as *.prev.
    vars:
      PROTON_SCRIPT: '{{ joinPath .REALPATH "linux" "scripts" "vpn-import.sh" }}'
      PROTON_CONF: '{{ joinPath .REALPATH "linux" "etc" "wireguard" "proton.conf" }}'
    preconditions:
      - sh: 'test -n "{{ .CLI_ARGS }}"'
        msg: 'usage: task ot:vpn-import -- <path-to-downloaded.conf>'
    cmds:
      - 'bash {{ .PROTON_SCRIPT }} {{ .PROTON_CONF }} "{{ .CLI_ARGS }}"'

  vpn-up:
    desc: Bring up the Proton WireGuard tunnel (also enables tailscale exit-node chaining through it)
    preconditions:
      - sh: sudo test -s /etc/wireguard/proton.key
        msg: '/etc/wireguard/proton.key is missing or empty — add your Proton private key first'
    cmds:
      - sudo systemctl start wg-quick@proton.service
      # wg-quick's hooks can't signal dnsmasq (wireguard_t confinement).
      - sudo systemctl start vpn-dns.service

  vpn-down:
    desc: Tear down the Proton WireGuard tunnel
    cmds:
      - sudo systemctl stop wg-quick@proton.service
      - sudo systemctl start vpn-dns.service

  vpn-rescue:
    desc: Emergency rollback — tear down the tunnel and restore LAN-only networking
    summary: |
      Idempotent, offline-usable. Stops the tunnel service (and any directly
      started tunnel), removes the vpn_bypass table and all policy rules it may
      have left, flushes tables 200/201, regenerates dnsmasq upstreams, and
      points /etc/resolv.conf at the LAN gateway. Leaves dnsmasq and Tailscale
      running; re-enter the managed state with `task ot:de` + restart dnsmasq,
      and `task ot:vpn-up` for the tunnel.
    cmds:
      - sudo systemctl stop wg-quick@proton.service 2>/dev/null || true
      - sudo wg-quick down proton 2>/dev/null || true
      # Clear leftovers from an interrupted teardown.
      - |
        while ip rule show | grep -q 'lookup 51820'; do sudo ip rule del table 51820; done
        while ip rule show | grep -q 'suppress_prefixlength 0'; do sudo ip rule del table main suppress_prefixlength 0; done
        while ip -6 rule show | grep -q 'lookup 51820'; do sudo ip -6 rule del table 51820; done
        while ip -6 rule show | grep -q 'suppress_prefixlength 0'; do sudo ip -6 rule del table main suppress_prefixlength 0; done
      - |
        sudo nft delete table ip vpn_bypass 2>/dev/null || true
        while ip rule show | grep -q 'fwmark 0x100/0x100 lookup 200'; do sudo ip rule del fwmark 0x100/0x100 table 200; done
        while ip rule show | grep -q 'fwmark 0x200 lookup 200'; do sudo ip rule del fwmark 0x200 table 200; done
        while ip rule show | grep -q 'to 100.64.0.0/10 lookup 52'; do sudo ip rule del to 100.64.0.0/10 lookup 52; done
        sudo ip -6 rule del to fd7a:115c:a1e0::/48 lookup 52 2>/dev/null || true
        sudo ip -6 rule del fwmark 0x201 table 201 2>/dev/null || true
      - sudo ip route flush table 200 || true
      - sudo ip -6 route flush table 201 || true
      - sudo systemctl start vpn-dns.service || true
      - |
        gw=$(ip route show default | awk '/^default/ {print $3; exit}')
        [ -n "$gw" ] || gw=192.168.40.1
        printf 'nameserver %s\nsearch lan\n' "$gw" | sudo tee /etc/resolv.conf >/dev/null
        echo "resolv.conf -> $gw; to return: task ot:de && sudo systemctl restart dnsmasq && task ot:vpn-up"

  vpn-status:
    desc: Show WireGuard tunnel state, bypass set, routing rules, dnsmasq upstreams
    cmds:
      - systemctl status wg-quick@proton.service --no-pager | head -5 || true
      - sudo wg show proton
      - sudo nft list set ip vpn_bypass bypass
      - ip rule show
      - ip -6 rule show
      - cat /proc/sys/net/ipv4/ip_forward /proc/sys/net/ipv6/conf/all/forwarding
      - firewall-cmd --get-zone-of-interface=tailscale0
      - ip route show table main | head -5
      - sudo cat /etc/dnsmasq.d/dnsmasq.servers
      - sudo cat /etc/dnsmasq.d/hosts.d/tailscale.hosts
      - systemctl status vpn-dns.timer --no-pager | head -4

  vpn-dns-refresh:
    desc: Regenerate dnsmasq upstreams (Proton/gateway) and Tailscale MagicDNS hosts
    cmds:
      - sudo systemctl start vpn-dns.service

  clean-packages:
    desc: List orphaned/unneeded zypper packages that can be removed without breaking deps
    vars:
      CANDIDATES:
        sh: zypper -q packages --orphaned --unneeded | grep '^i' | cut -d'|' -f3 | tr -d ' ' | sort -u
      REMOVE: '{{.REMOVE | default "false"}}'
    cmds:
      - for:
          var: CANDIDATES
          as: PKG
        cmd: '{{if eq .REMOVE "true"}}sudo zypper rm -y{{else}}echo{{end}} {{.PKG}}'
        if: test -z "$(rpm -e --test {{.PKG}} 2>&1)"

  restart-kde:
    desc: Restart the KDE Plasma desktop environment
    aliases:
      - rk
    cmds:
      - systemctl restart --user plasma-plasmashell

  restart-kde-lockscreen:
    desc: Restart the KDE Plasma desktop environment
    aliases:
      - rl
    cmds:
      - pkill -9 kscreenlocker*

  update:
    desc: Update OpenSuse via Zypper
    cmds:
      - task: update-flatpak
      - sudo zypper dup -ly --allow-vendor-change --replacefiles

  update-flatpak:
    desc: Install flatpaks listed in FLATPAKS (skips already-installed)
    vars:
      FLATPAKS:
        - app.legcord.Legcord
        - com.notesnook.Notesnook
        - org.signal.Signal
    cmds:
      - flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - for:
          var: FLATPAKS
          as: PKG
        cmd: flatpak install --or-update --user -y flathub {{.PKG}}
      - flatpak uninstall --unused -y --user
