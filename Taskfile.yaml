version: '3'

vars:
  REALPATH:
    sh: dirname $(realpath ./Taskfile.yaml)

dotenv: ['/etc/os-release']

includes:
  opensuse-tumbleweed:
    aliases: ['ot']
    optional: true
    taskfile: ~/Taskfile.opensuse-tumbleweed.yaml

tasks:
  default:
    cmds:
      - task --list

  init:
    cmds:
      - task: "{{ .ID }}:init"

  create-symlinks:
    desc: Create symlinks for dotfiles with automatic backup of existing files
    aliases:
      - cs
    vars:
      FILES:
        sh: >-
          cd $(dirname $(realpath ./Taskfile.yaml))/home; find . \(
          -path "./.git"
          \) -prune -o \( -type f -o -type l \) -print
    dir: '{{ .REALPATH }}'
    cmds:
      - for:
          var: FILES
        vars:
          SOURCE: '{{ joinPath .REALPATH "home" .ITEM }}'
          DESTINATION: '{{ joinPath .HOME .ITEM }}'
        task: deploy-file
      - task: create-symlinks-darwin
      - task: create-symlinks-linux

  create-symlinks-darwin:
    aliases: [csd]
    platforms: [darwin]
    vars:
      REALPATH_DARWIN: '{{ joinPath .REALPATH "darwin" "home" }}'
      FILES:
        sh: find {{ .REALPATH_DARWIN }} -type f -printf "%P\n"
    dir: '{{ .REALPATH_DARWIN }}'
    cmds:
      - for:
          var: FILES
        vars:
          SOURCE: '{{ joinPath .REALPATH_DARWIN .ITEM }}'
          DESTINATION: '{{ joinPath .HOME .ITEM }}'
        task: deploy-file

  create-symlinks-linux:
    aliases: [csl]
    platforms: [linux]
    vars:
      REALPATH_LINUX: '{{ joinPath .REALPATH "linux" "home" }}'
      FILES:
        sh: find {{ .REALPATH_LINUX }} -type f -printf "%P\n"
    dir: '{{ .REALPATH_LINUX }}'
    cmds:
      - for:
          var: FILES
        vars:
          SOURCE: '{{ joinPath .REALPATH_LINUX .ITEM }}'
          DESTINATION: '{{ joinPath .HOME .ITEM }}'
        task: deploy-file

  clean-symlinks:
    desc: Find and delete broken symlinks from $HOME that point into this dotfiles repo
    aliases: [clean]
    vars:
      BROKEN_SYMLINKS:
        sh: >-
          find "$HOME"
          \( -path "$HOME/.local/share/flatpak" -o -path "$HOME/.var" -o -path "$HOME/.cache" \) -prune
          -o -xtype l -print
    cmds:
      - for:
          var: BROKEN_SYMLINKS
        cmd: rm -v "{{ .ITEM }}"
        if: readlink -m "{{ .ITEM }}" | grep -qE "^{{ .REALPATH }}(/|$)"

  adopt:
    desc: Move a HOME-relative or in-HOME absolute file into the dotfiles repo, then symlink it back
    aliases: [a]
    summary: |
      Usage: task adopt -- .config/foo/bar.toml
             task adopt -- /home/alex/.config/foo/bar.toml     # absolute, must be under $HOME
             task adopt OS=1 -- .config/foo/bar.toml           # place under OS-specific dir
    vars:
      OS_SUBDIR: '{{ if .OS }}{{ joinPath OS "home" }}{{ end }}'
      RELATIVE: '{{ trimPrefix .HOME .CLI_ARGS | trimPrefix "/" }}'
      SOURCE: '{{ joinPath .HOME .RELATIVE }}'
      DESTINATION: '{{ joinPath .REALPATH "home" .OS_SUBDIR .RELATIVE }}'
    preconditions:
      - sh: 'test -n "{{ .CLI_ARGS }}"'
        msg: 'usage: task adopt -- <path>'
      - sh: '[[ "{{ .CLI_ARGS }}" != /* || "{{ .CLI_ARGS }}" == "{{ .HOME }}"/* ]]'
        msg: 'absolute paths must be inside {{ .HOME }}'
      - sh: 'test -e {{ .SOURCE }}'
        msg: 'no such file: {{ .SOURCE }}'
    cmds:
      - cmd: 'mkdir -p {{ dir .DESTINATION }}'
      - cmd: 'mv {{ .SOURCE }} {{ .DESTINATION }}'
      - task: deploy-file
        vars:
          SOURCE: '{{ .DESTINATION }}'
          DESTINATION: '{{ .SOURCE }}'

  # Package Management

  update:
    desc: Update everything
    aliases: [u]
    cmds:
      - task: brew
      - task: helix
      - cmd: ya pkg add yazi-rs/flavors:catppuccin-macchiato
        ignore_error: true
      - cmd: ya pkg add yazi-rs/plugins:git
        ignore_error: true
      - cmd: ya pkg upgrade
        ignore_error: true
      - cmd: dprint config update
      - task: "{{ .ID }}:update"

  brew:
    desc: Upgrade homebrew, all packages, and install missing
    aliases: [b]
    cmds:
      - brew update
      - brew upgrade --yes
      - brew bundle
      - brew cleanup

  helix:
    desc: Install and update packages for a helix fork that enable plugins via steel/scheme
    aliases: [h]
    cmds:
      - cargo install --git https://github.com/mattwparas/steel.git steel-forge
      - forge pkg install --git https://github.com/mattwparas/helix-config.git
      - forge pkg install --git https://github.com/mattwparas/helix-file-watcher.git
      - mkdir -p ~/git
      - task: helix-clone
      - task: helix-build
    ignore_error: true

  helix-clone:
    internal: true
    status:
      - test -d ~/git/helix
    dir: ~/git
    cmds:
      - git clone https://github.com/mattwparas/helix.git

  helix-build:
    internal: true
    dir: ~/git/helix
    cmds:
      - git switch steel-event-system
      - git pull
      - cargo xtask steel
    ignore_error: true

  # Services

  opencode-restart:
    desc: Restart the opencode web server
    aliases: [or]
    cmds:
      - cmd: 'launchctl kickstart -k gui/$(id -u)/sh.opencode.web'
        platforms: [darwin]
      - cmd: 'systemctl --user restart opencode.service'
        platforms: [linux]

  opencode-status:
    desc: Show the status of the opencode web server process
    aliases: [os]
    cmds:
      - cmd: 'launchctl list sh.opencode.web'
        platforms: [darwin]
      - cmd: 'systemctl --user status opencode.service'
        platforms: [linux]

  opencode-log:
    desc: Open the most recent opencode log in helix
    aliases: [ol]
    cmds:
      - hx "$(ls -t {{ .HOME }}/.local/share/opencode/log/*.log | head -1)"

  # Internals

  deploy-file:
    internal: true
    requires:
      vars:
        - SOURCE
        - DESTINATION
    vars:
      # --remove-destination: replace an earlier deploy's symlink, don't write through it.
      CP_CMD: 'cp -f --remove-destination --preserve=mode,timestamps'
      LN_CMD: 'ln -fns'
      SUDO_CMD: '{{ if eq "true" (.SUDO | default "false") }}sudo {{ end }}'
      DEPLOY_CMD: '{{ if eq "true" (.COPY | default "false") }}{{ .CP_CMD }}{{ else }}{{ .LN_CMD }}{{ end }}'
    cmds:
      - cmd: '{{.SUDO_CMD}}mkdir -p {{ dir .DESTINATION }}'
      - cmd: '{{.SUDO_CMD}}{{.DEPLOY_CMD}} {{ .SOURCE }} {{ .DESTINATION }}'
      - cmd: '{{.SUDO_CMD}}systemctl daemon-reload'
        if: '{{ and (eq OS "linux") (hasSuffix ".service" .DESTINATION) (eq "true" (.SUDO | default "false")) }}'
      - cmd: 'systemctl --user daemon-reload && systemctl --user enable --now $(basename {{ .DESTINATION }})'
        if: '{{ and (eq OS "linux") (hasSuffix ".service" .DESTINATION) (not (eq "true" (.SUDO | default "false"))) }}'
      - cmd: 'launchctl bootout gui/$(id -u) {{ .DESTINATION }} 2>/dev/null || true; launchctl bootstrap gui/$(id -u) {{ .DESTINATION }}'
        if: '{{ and (eq OS "darwin") (hasSuffix ".plist" .DESTINATION) }}'
